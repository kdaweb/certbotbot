---
name: Publish

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - "master"
    tags:
      - "v*"
  workflow_dispatch:

permissions: read-all

jobs:
  publish_image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v3

      - name: Build and Publish Image
        uses: wesley-dean/publish_container@28f90b574acde9d9b3a6e1310daf5331825b5c4b # pin@v1.1.1
        with:
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_PAT }}
          dockerhub_image: ${{ secrets.DOCKERHUB_IMAGE }}
          dockerhub_registry: docker.io
          github_ref: ${{ github.ref }}
          repository_name: ${{ github.event.repository.name }}
